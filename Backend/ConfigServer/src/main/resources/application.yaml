server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/raj-singh-23/config-server.git
          skip-ssl-validation: true
          default-label: main
          clone-on-start: true
          search-paths: /
          timeout: 60
          refresh-rate: 0